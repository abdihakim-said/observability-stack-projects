service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-target-type: ip

elasticsearchHosts: "https://elasticsearch-master:9200"

kibanaConfig:
  kibana.yml: |
    server.host: "0.0.0.0"
    elasticsearch.hosts: ["https://elasticsearch-master:9200"]
    elasticsearch.ssl.verificationMode: none
    elasticsearch.serviceAccountToken: "<KIBANA_SERVICE_TOKEN>"  # elasticsearch-service-tokens create elastic/kibana kibana
    xpack.security.encryptionKey: "<32+ character random string>"
    xpack.encryptedSavedObjects.encryptionKey: "<32+ character random string>"
    xpack.reporting.encryptionKey: "<32+ character random string>"

rbac:
  create: true
  serviceAccount:
    create: true

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"                                   